<!DOCTYPE html>
<html lang="pt-br">
<head>
<link rel="shortcut icon" type="imagex/png" href="./miku.ico">
<meta charset="UTF-8">
<title>ASCII Studio</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>
<style>
    :root {
        --bg: #0a0a0a;
        --panel: #111111;
        --border: #2a2a2a;
        --accent: #00d9ff;
        --text: #d0d0d0;
        --text-dim: #6a6a6a;
        --mono: 'Courier New', Courier, monospace;
    }

    * { box-sizing: border-box; }

    html, body {
        margin: 0;
        padding: 0;
        background: var(--bg);
        color: var(--text);
        font-family: var(--mono);
        height: 100%;
    }

    body {
        display: flex;
        flex-direction: column;
        height: 100vh;
    }

    header {
        padding: 14px 20px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: baseline;
        gap: 10px;
    }

    header .title {
        font-size: 15px;
        letter-spacing: 3px;
        color: var(--accent);
        text-transform: uppercase;
    }

    header .subtitle {
        font-size: 11px;
        color: var(--text-dim);
    }

    .layout {
        flex: 1;
        display: flex;
        min-height: 0;
    }

    .stage {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        background:
            linear-gradient(var(--border) 1px, transparent 1px),
            linear-gradient(90deg, var(--border) 1px, transparent 1px);
        background-size: 24px 24px;
        background-color: #060606;
        overflow: hidden;
    }

    #canvas {
        max-width: 96%;
        max-height: 96%;
    }

    .empty-state {
        color: var(--text-dim);
        font-size: 12px;
        text-align: center;
        line-height: 1.8;
        border: 1px dashed var(--border);
        padding: 40px 50px;
    }

    .empty-state .arrow { color: var(--accent); font-size: 20px; }

    aside {
        width: 300px;
        flex-shrink: 0;
        border-left: 1px solid var(--border);
        background: var(--panel);
        overflow-y: auto;
        padding: 18px;
    }

    .field {
        margin-bottom: 18px;
    }

    .field label {
        display: flex;
        justify-content: space-between;
        font-size: 10px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        color: var(--text-dim);
        margin-bottom: 7px;
    }

    .field label span.val {
        color: var(--accent);
        letter-spacing: 0;
        text-transform: none;
    }

    input[type="range"] {
        width: 100%;
        accent-color: var(--accent);
        background: transparent;
    }

    input[type="text"], input[type="number"] {
        width: 100%;
        background: #000;
        border: 1px solid var(--border);
        color: var(--text);
        font-family: var(--mono);
        font-size: 13px;
        padding: 8px;
        outline: none;
    }
    input[type="text"]:focus, input[type="number"]:focus {
        border-color: var(--accent);
    }

    .color-row {
        display: flex;
        gap: 8px;
        align-items: center;
    }
    input[type="color"] {
        width: 40px;
        height: 32px;
        border: 1px solid var(--border);
        background: #000;
        padding: 2px;
        cursor: pointer;
    }
    .color-mode {
        flex: 1;
        display: flex;
        gap: 6px;
    }

    .toggle-btn {
        flex: 1;
        background: #000;
        border: 1px solid var(--border);
        color: var(--text-dim);
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 1px;
        text-transform: uppercase;
        padding: 8px 4px;
        cursor: pointer;
    }
    .toggle-btn.active {
        border-color: var(--accent);
        color: var(--accent);
    }

    .upload-zone {
        border: 1px dashed var(--border);
        padding: 16px;
        text-align: center;
        font-size: 11px;
        color: var(--text-dim);
        cursor: pointer;
        margin-bottom: 20px;
        transition: border-color 0.15s;
    }
    .upload-zone:hover { border-color: var(--accent); color: var(--text); }
    .upload-zone.has-file { border-color: var(--accent); color: var(--accent); }
    .upload-zone input { display: none; }

    .divider {
        border: none;
        border-top: 1px solid var(--border);
        margin: 20px 0;
    }

    .section-label {
        font-size: 10px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        color: var(--accent);
        margin-bottom: 14px;
    }

    .btn-download {
        width: 100%;
        background: var(--accent);
        color: #000;
        border: none;
        font-family: var(--mono);
        font-weight: bold;
        font-size: 11px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        padding: 12px;
        cursor: pointer;
        margin-top: 6px;
    }
    .btn-download:hover { opacity: 0.85; }
    .btn-download:disabled { background: var(--border); color: var(--text-dim); cursor: not-allowed; }

    .btn-gif {
        width: 100%;
        background: transparent;
        color: var(--accent);
        border: 1px solid var(--accent);
        font-family: var(--mono);
        font-weight: bold;
        font-size: 11px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        padding: 12px;
        cursor: pointer;
        margin-top: 10px;
    }
    .btn-gif:hover { background: rgba(0,255,200,0.08); }
    .btn-gif:disabled { border-color: var(--border); color: var(--text-dim); cursor: not-allowed; background: transparent; }

    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--panel); }
    ::-webkit-scrollbar-thumb { background: var(--border); }
</style>
</head>
<body>

<header>
    <span class="title">ASCII Studio</span>
    <span class="subtitle">converta uma imagem em uma textura de texto animada! ~ By @lscski</span>
</header>

<div class="layout">
    <div class="stage" id="stage">
        <div class="empty-state" id="emptyState">
            <div class="arrow">&#8592;</div><br>
            carregue uma imagem no painel<br>para gerar a pré-visualização
        </div>
        <canvas id="canvas" style="display:none;"></canvas>
    </div>

    <aside>
        <label class="upload-zone" id="uploadZone">
            <span id="uploadLabel">clique ou arraste uma imagem aqui</span>
            <input type="file" id="fileInput" accept="image/*">
        </label>

        <div class="section-label">...</div>

        <div class="field">
            <label>Padrão de texto <span class="val" id="textPatternVal"></span></label>
            <input type="text" id="textPattern" value="LSCSK" maxlength="20">
        </div>

        <div class="field">
            <label>Tamanho da fonte <span class="val" id="fontScaleVal">1.2x</span></label>
            <input type="range" id="fontScale" min="0.5" max="2.5" step="0.05" value="1.2">
        </div>

        <div class="field">
            <label>Velocidade de rolagem <span class="val" id="speedVal">0.20</span></label>
            <input type="range" id="speed" min="0" max="1" step="0.02" value="0.20">
        </div>

        <hr class="divider">
        <div class="section-label">Grade</div>

        <div class="field">
            <label>Colunas <span class="val" id="colsVal">90</span></label>
            <input type="range" id="cols" min="20" max="220" step="1" value="90">
        </div>

        <div class="field">
            <label>Correção de proporção <span class="val" id="aspectVal">0.60</span></label>
            <input type="range" id="aspect" min="0.3" max="1.0" step="0.02" value="0.60">
        </div>

        <div class="field">
            <label>Limiar mínimo de brilho <span class="val" id="thresholdVal">0</span></label>
            <input type="range" id="threshold" min="0" max="250" step="5" value="0">
        </div>

        <hr class="divider">
        <div class="section-label">Cor</div>

        <div class="field">
            <div class="color-mode">
                <button class="toggle-btn active" id="modeReal" data-mode="real">Cor real</button>
                <button class="toggle-btn" id="modeFixed" data-mode="fixed">Cor fixa</button>
            </div>
        </div>

        <div class="field" id="fixedColorField" style="display:none;">
            <label>Cor do texto</label>
            <div class="color-row">
                <input type="color" id="fixedColor" value="#00d9ff">
            </div>
        </div>

        <div class="field">
            <label>Intensidade mínima <span class="val" id="alphaFloorVal">0%</span></label>
            <input type="range" id="alphaFloor" min="0" max="90" step="5" value="0">
        </div>

        <hr class="divider">

        <button class="btn-download" id="downloadBtn" disabled>Baixar HTML do resultado</button>
        <!--<button class="btn-gif" id="gifBtn" disabled>Gerar GIF (20 frames)</button>-->
    </aside>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d', {
    willReadFrequently: true
});
const stage = document.getElementById('stage');
const emptyState = document.getElementById('emptyState');
const uploadZone = document.getElementById('uploadZone');
const uploadLabel = document.getElementById('uploadLabel');
const fileInput = document.getElementById('fileInput');
const downloadBtn = document.getElementById('downloadBtn');
const gifBtn = document.getElementById('gifBtn');

let pixelData = [];
let rows = 0;
let cols = 0;
let img = null;
let offset = 0;
let rafId = null;

const state = {
    textPattern: 'LSCSK',
    fontScale: 1.2,
    speed: 0.20,
    cols: 90,
    aspect: 0.60,
    threshold: 0,
    colorMode: 'real',
    fixedColor: '#00d9ff',
    alphaFloor: 0
};

//controles
function hexToRgb(hex) {
    const v = hex.replace('#', '');
    return {
        r: parseInt(v.substring(0, 2), 16),
        g: parseInt(v.substring(2, 4), 16),
        b: parseInt(v.substring(4, 6), 16)
    };
}

document.getElementById('textPattern').addEventListener('input', e => {
    state.textPattern = e.target.value || ' ';
});

document.getElementById('fontScale').addEventListener('input', e => {
    state.fontScale = parseFloat(e.target.value);
    document.getElementById('fontScaleVal').textContent = state.fontScale.toFixed(2) + 'x';
    if (img) resizeCanvas();
});

document.getElementById('speed').addEventListener('input', e => {
    state.speed = parseFloat(e.target.value);
    document.getElementById('speedVal').textContent = state.speed.toFixed(2);
});

document.getElementById('cols').addEventListener('input', e => {
    state.cols = parseInt(e.target.value);
    document.getElementById('colsVal').textContent = state.cols;
    if (img) regenerateGrid();
});

document.getElementById('aspect').addEventListener('input', e => {
    state.aspect = parseFloat(e.target.value);
    document.getElementById('aspectVal').textContent = state.aspect.toFixed(2);
    if (img) regenerateGrid();
});

document.getElementById('threshold').addEventListener('input', e => {
    state.threshold = parseInt(e.target.value);
    document.getElementById('thresholdVal').textContent = state.threshold;
});

document.getElementById('alphaFloor').addEventListener('input', e => {
    state.alphaFloor = parseInt(e.target.value);
    document.getElementById('alphaFloorVal').textContent = state.alphaFloor + '%';
});

document.getElementById('fixedColor').addEventListener('input', e => {
    state.fixedColor = e.target.value;
});

document.getElementById('modeReal').addEventListener('click', () => setColorMode('real'));
document.getElementById('modeFixed').addEventListener('click', () => setColorMode('fixed'));

function setColorMode(mode) {
    state.colorMode = mode;
    document.getElementById('modeReal').classList.toggle('active', mode === 'real');
    document.getElementById('modeFixed').classList.toggle('active', mode === 'fixed');
    document.getElementById('fixedColorField').style.display = mode === 'fixed' ? 'block' : 'none';
}

// ---------- upload ----------
uploadZone.addEventListener('click', () => fileInput.click());
uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.style.borderColor = 'var(--accent)'; });
uploadZone.addEventListener('drop', e => {
    e.preventDefault();
    if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', e => {
    if (e.target.files[0]) loadFile(e.target.files[0]);
});

function loadFile(file) {
    if (!file.type.startsWith('image/')) return;
    const reader = new FileReader();
    reader.onload = ev => {
        img = new Image();
        img.onload = () => {
            uploadLabel.textContent = file.name;
            uploadZone.classList.add('has-file');
            emptyState.style.display = 'none';
            canvas.style.display = 'block';
            downloadBtn.disabled = false;
            gifBtn.disabled = false;
            regenerateGrid();
            if (!rafId) draw();
        };
        img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
}

//grade
function imageToPixelData(image, targetCols, aspectCorrection) {
    const targetRows = Math.max(1, Math.round((image.height / image.width) * targetCols * aspectCorrection));

    const offCanvas = document.createElement('canvas');
    offCanvas.width = targetCols;
    offCanvas.height = targetRows;
    const offCtx = offCanvas.getContext('2d', {
    willReadFrequently: true
});
    offCtx.drawImage(image, 0, 0, targetCols, targetRows);

    const imgData = offCtx.getImageData(0, 0, targetCols, targetRows).data;

    const grid = [];
    for (let r = 0; r < targetRows; r++) {
        const row = [];
        for (let c = 0; c < targetCols; c++) {
            const i = (r * targetCols + c) * 4;
            const red = imgData[i];
            const green = imgData[i + 1];
            const blue = imgData[i + 2];
            const alphaCh = imgData[i + 3];
            const brightness = (red * 0.299 + green * 0.587 + blue * 0.114) * (alphaCh / 255);
            row.push({ r: red, g: green, b: blue, brightness });
        }
        grid.push(row);
    }
    return grid;
}

function regenerateGrid() {
    pixelData = imageToPixelData(img, state.cols, state.aspect);
    rows = pixelData.length;
    cols = pixelData[0].length;
    resizeCanvas();
}

function resizeCanvas() {
    const stageW = stage.clientWidth * 0.96;
    const stageH = stage.clientHeight * 0.96;

    const fontSize = Math.min(stageW / cols * state.fontScale, stageH / rows);
    ctx.font = `bold ${fontSize}px 'Courier New', Courier, monospace`;

    const charWidth = ctx.measureText('M').width;
    const charHeight = fontSize * 0.9;

    canvas.width = cols * charWidth;
    canvas.height = rows * charHeight;
}

function draw() {
    if (img && rows && cols) {
        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const charWidth = canvas.width / cols;
        const charHeight = canvas.height / rows;
        const fontSize = charHeight / 0.9;
        ctx.font = `bold ${fontSize}px 'Courier New', Courier, monospace`;
        ctx.textBaseline = 'top';

        const pattern = state.textPattern.length ? state.textPattern : ' ';
        const fixedRgb = hexToRgb(state.fixedColor);
        const floor = state.alphaFloor / 100;

        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                const pixel = pixelData[r][c];
                if (pixel.brightness < state.threshold) continue;

                const charIndex = Math.floor(c + offset) % pattern.length;
                const char = pattern[(charIndex + pattern.length) % pattern.length];

                let alpha = Math.max(pixel.brightness / 255, floor);
                if (alpha <= 0) continue;

                if (state.colorMode === 'real') {
                    ctx.fillStyle = `rgba(${pixel.r}, ${pixel.g}, ${pixel.b}, ${alpha})`;
                } else {
                    ctx.fillStyle = `rgba(${fixedRgb.r}, ${fixedRgb.g}, ${fixedRgb.b}, ${alpha})`;
                }

                ctx.fillText(char, c * charWidth, r * charHeight);
            }
        }

        offset += state.speed;
    }
    rafId = requestAnimationFrame(draw);
}

window.addEventListener('resize', () => { if (img) resizeCanvas(); });

//gerar GIF
gifBtn.addEventListener('click', () => {
    if (!img) return;

    gifBtn.disabled = true;
    const originalLabel = gifBtn.textContent;

    const totalFrames = 20;
    const frameDelay = 80; //velocidade do loop.

    const gif = new GIF({
        workers: 2,
        quality: 10,
        width: canvas.width,
        height: canvas.height,
        workerScript: './gif.worker.js'
    });

    let captured = 0;
    gifBtn.textContent = `Gerando... 0/${totalFrames}`;

    const captureTimer = setInterval(() => {
        gif.addFrame(canvas, { copy: true, delay: frameDelay });
        captured++;
        gifBtn.textContent = `Gerando... ${captured}/${totalFrames}`;

        if (captured >= totalFrames) {
            clearInterval(captureTimer);
            gifBtn.textContent = 'Renderizando...';

            gif.on('finished', (blob) => {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'ascii-art.gif';
                a.click();
                URL.revokeObjectURL(url);
                gifBtn.disabled = false;
                gifBtn.textContent = originalLabel;
            });
            gif.render();
        }
    }, frameDelay);
});

//exportar HTML
downloadBtn.addEventListener('click', () => {
    if (!img) return;

    const imageDataUrl = img.src; // já é base64 (FileReader)
    const fixedRgb = hexToRgb(state.fixedColor);
    const scriptOpen = '<' + 'script>';
    const scriptClose = '</' + 'script>';

    const innerScriptLines = [
        "const canvas = document.getElementById('canvas');",
        "const ctx = canvas.getContext('2d');",
        "let pixelData = [], rows = 0, cols = 0, offset = 0;",
        "",
        "const textPattern = " + JSON.stringify(state.textPattern || ' ') + ";",
        "const speed = " + state.speed + ";",
        "const targetCols = " + state.cols + ";",
        "const aspectCorrection = " + state.aspect + ";",
        "const threshold = " + state.threshold + ";",
        "const colorMode = " + JSON.stringify(state.colorMode) + ";",
        "const fixedColor = { r: " + fixedRgb.r + ", g: " + fixedRgb.g + ", b: " + fixedRgb.b + " };",
        "const alphaFloor = " + (state.alphaFloor / 100) + ";",
        "const fontScale = " + state.fontScale + ";",
        "",
        "function imageToPixelData(img, cols, aspect) {",
        "    const tRows = Math.max(1, Math.round((img.height / img.width) * cols * aspect));",
        "    const off = document.createElement('canvas');",
        "    off.width = cols; off.height = tRows;",
        "    const offCtx = off.getContext('2d');",
        "    offCtx.drawImage(img, 0, 0, cols, tRows);",
        "    const data = offCtx.getImageData(0, 0, cols, tRows).data;",
        "    const grid = [];",
        "    for (let r = 0; r < tRows; r++) {",
        "        const row = [];",
        "        for (let c = 0; c < cols; c++) {",
        "            const i = (r * cols + c) * 4;",
        "            const red = data[i], green = data[i+1], blue = data[i+2], a = data[i+3];",
        "            const brightness = (red*0.299 + green*0.587 + blue*0.114) * (a/255);",
        "            row.push({ r: red, g: green, b: blue, brightness });",
        "        }",
        "        grid.push(row);",
        "    }",
        "    return grid;",
        "}",
        "",
        "function resizeCanvas() {",
        "    const fontSize = Math.min(window.innerWidth / cols * fontScale, window.innerHeight / rows);",
        "    ctx.font = 'bold ' + fontSize + \"px 'Courier New', Courier, monospace\";",
        "    const charWidth = ctx.measureText('M').width;",
        "    const charHeight = fontSize * 0.9;",
        "    canvas.width = cols * charWidth;",
        "    canvas.height = rows * charHeight;",
        "}",
        "",
        "function draw() {",
        "    ctx.fillStyle = '#000';",
        "    ctx.fillRect(0, 0, canvas.width, canvas.height);",
        "    const charWidth = canvas.width / cols;",
        "    const charHeight = canvas.height / rows;",
        "    const fontSize = charHeight / 0.9;",
        "    ctx.font = 'bold ' + fontSize + \"px 'Courier New', Courier, monospace\";",
        "    ctx.textBaseline = 'top';",
        "",
        "    for (let r = 0; r < rows; r++) {",
        "        for (let c = 0; c < cols; c++) {",
        "            const p = pixelData[r][c];",
        "            if (p.brightness < threshold) continue;",
        "            const idx = Math.floor(c + offset) % textPattern.length;",
        "            const char = textPattern[(idx + textPattern.length) % textPattern.length];",
        "            let alpha = Math.max(p.brightness / 255, alphaFloor);",
        "            if (alpha <= 0) continue;",
        "            ctx.fillStyle = colorMode === 'real'",
        "                ? 'rgba(' + p.r + ',' + p.g + ',' + p.b + ',' + alpha + ')'",
        "                : 'rgba(' + fixedColor.r + ',' + fixedColor.g + ',' + fixedColor.b + ',' + alpha + ')';",
        "            ctx.fillText(char, c * charWidth, r * charHeight);",
        "        }",
        "    }",
        "    offset += speed;",
        "    requestAnimationFrame(draw);",
        "}",
        "",
        "const img = new Image();",
        "img.onload = () => {",
        "    pixelData = imageToPixelData(img, targetCols, aspectCorrection);",
        "    rows = pixelData.length;",
        "    cols = pixelData[0].length;",
        "    resizeCanvas();",
        "    draw();",
        "};",
        "img.src = " + JSON.stringify(imageDataUrl) + ";",
        "window.addEventListener('resize', () => { if (rows && cols) resizeCanvas(); });"
    ].join('\n');

    const htmlLines = [
        '<!DOCTYPE html>',
        '<html lang="pt-br">',
        '<head>',
        '<meta charset="UTF-8">',
        '<title>ASCII Art</title>',
        '<style>',
        '    html, body { margin: 0; padding: 0; background: #000; overflow: hidden; height: 100%; }',
        '    canvas { display: block; margin: 0 auto; }',
        '</style>',
        '</head>',
        '<body>',
        '<canvas id="canvas"></canvas>',
        scriptOpen,
        innerScriptLines,
        scriptClose,
        '</body>',
        '</html>'
    ];

    const html = htmlLines.join('\n');

    const blob = new Blob([html], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'ascii-art-resultado.html';
    a.click();
    URL.revokeObjectURL(url);
});
</script>

</body>
</html>
